services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: transparencia_total
      POSTGRES_USER: transparencia
      POSTGRES_PASSWORD: desenvolvimento_local
    ports:
      - "5432:5432"
    volumes:
      - transparencia_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U transparencia -d transparencia_total"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  transparencia_postgres:
