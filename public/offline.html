<!doctype html>
<html lang="pt-PT">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <meta name="theme-color" content="#07182a" />
    <title>Sem ligação · Transparência Total</title>
    <style>
      body{margin:0;min-height:100vh;display:grid;place-items:center;padding:24px;background:#f4f7f6;color:#07182a;font-family:Arial,sans-serif}.box{max-width:560px;padding:36px;border:1px solid #dfe5e8;border-radius:22px;background:white;box-shadow:0 16px 42px rgba(7,24,42,.08)}span{display:inline-block;padding:7px 10px;border-radius:999px;background:#dff7f2;color:#0f766e;font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.08em}h1{font-size:38px;letter-spacing:-.04em;margin:18px 0 10px}p{color:#526071;line-height:1.65}button{min-height:46px;padding:0 18px;border:0;border-radius:11px;background:#07182a;color:white;font-weight:700;cursor:pointer}
    </style>
  </head>
  <body>
    <main class="box">
      <span>Modo offline</span>
      <h1>Sem ligação à Internet</h1>
      <p>As páginas já consultadas podem continuar disponíveis. Para verificar fontes oficiais e obter atualizações, volte a ligar-se à Internet.</p>
      <button onclick="location.reload()">Tentar novamente</button>
    </main>
  </body>
</html>
