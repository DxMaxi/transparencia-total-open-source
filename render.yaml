databases:
  - name: transparencia-total-db
    plan: free
    databaseName: transparencia_total
    user: transparencia_total

services:
  - type: web
    name: transparencia-total-api
    runtime: python
    plan: free
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: python -m scripts.bootstrap_v4_public && uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/v1/health
    envVars:
      - key: PYTHON_VERSION
        value: 3.13.5
      - key: ENVIRONMENT
        value: production
      - key: AI_PROVIDER
        value: disabled
      - key: DATABASE_URL
        fromDatabase:
          name: transparencia-total-db
          property: connectionString
      - key: CORS_ORIGINS
        sync: false
      - key: ADMIN_API_KEY
        generateValue: true
      - key: VAPID_PUBLIC_KEY
        sync: false
      - key: VAPID_PRIVATE_KEY
        sync: false
      - key: VAPID_SUBJECT
        sync: false
