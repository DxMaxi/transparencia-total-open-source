name: Operational status

on:
  schedule:
    - cron: "23 6 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: transparencia-total-operational-status
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 20
    env:
      DATABASE_URL: ${{ secrets.PRODUCTION_DATABASE_URL }}
      ENVIRONMENT: production
      CORS_ORIGINS: https://www.transparenciatotal.pt
      OFFICIAL_USER_AGENT: ${{ secrets.PRODUCTION_OFFICIAL_USER_AGENT }}
      V4_SOURCE_MAX_AGE_HOURS: "36"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Validar configuração
        run: |
          test -n "$DATABASE_URL"
          test -n "$OFFICIAL_USER_AGENT"
      - name: Instalar backend
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e './backend'
      - name: Verificar frescura e estado das fontes
        working-directory: backend
        run: python -m scripts.check_v4_operational_status

