name: Archive integrity

on:
  schedule:
    - cron: "17 4 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: transparencia-total-archive-integrity
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 45
    env:
      DATABASE_URL: ${{ secrets.PRODUCTION_DATABASE_URL }}
      ENVIRONMENT: production
      CORS_ORIGINS: https://www.transparenciatotal.pt
      OFFICIAL_USER_AGENT: ${{ secrets.PRODUCTION_OFFICIAL_USER_AGENT }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Validar configuração
        run: |
          test -n "$DATABASE_URL"
          test -n "$OFFICIAL_USER_AGENT"
      - name: Instalar backend
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e './backend'
      - name: Verificar todos os objetos arquivados
        working-directory: backend
        run: python -m scripts.verify_v4_archive
