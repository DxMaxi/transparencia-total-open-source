name: Archive integrity

on:
  schedule:
    - cron: "17 4 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: transparencia-total-archive-integrity
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 45
    env:
      DATABASE_URL: ${{ secrets.PRODUCTION_DATABASE_URL }}
      ENVIRONMENT: production
      CORS_ORIGINS: https://www.transparenciatotal.pt
      OFFICIAL_USER_AGENT: ${{ secrets.PRODUCTION_OFFICIAL_USER_AGENT }}
      RAW_ARCHIVE_WARNING_BYTES: ${{ vars.RAW_ARCHIVE_WARNING_BYTES || '400000000' }}
      DATABASE_WARNING_BYTES: ${{ vars.DATABASE_WARNING_BYTES || '450000000' }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version-file: .python-version
          cache: pip
      - name: Validar configuração
        run: |
          test -n "$DATABASE_URL"
          test -n "$OFFICIAL_USER_AGENT"
      - name: Instalar backend
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e './backend'
      - name: Medir capacidade do arquivo
        id: capacity
        shell: bash
        continue-on-error: true
        working-directory: backend
        run: python -m scripts.report_archive_capacity | tee capacity-report.json
      - name: Verificar todos os objetos arquivados
        id: integrity
        shell: bash
        if: ${{ !cancelled() && (steps.capacity.outcome == 'success' || steps.capacity.outcome == 'failure') }}
        continue-on-error: true
        working-directory: backend
        run: python -m scripts.verify_v4_archive | tee integrity-report.json
      - name: Guardar os relatórios sem conteúdo de documentos
        if: ${{ !cancelled() && steps.capacity.outcome != 'skipped' }}
        uses: actions/upload-artifact@v7
        with:
          name: database-capacity-and-archive-integrity
          path: |
            backend/capacity-report.json
            backend/integrity-report.json
          if-no-files-found: error
          retention-days: 30
      - name: Assinalar aviso de capacidade ou falha de integridade
        if: ${{ !cancelled() && (steps.capacity.outcome == 'failure' || steps.integrity.outcome == 'failure') }}
        run: |
          echo "Capacidade ou integridade requer atenção; consultar os relatórios separados."
          exit 1

