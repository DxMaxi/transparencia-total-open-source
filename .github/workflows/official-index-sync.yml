name: Official index sync

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/official-index-sync.yml"
      - "backend/scripts/refresh_v4_indexes.py"
      - "backend/app/services/v4_rollout.py"
  schedule:
    - cron: "17 2 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: transparencia-total-official-index-sync
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 120
    env:
      DATABASE_URL: ${{ secrets.PRODUCTION_DATABASE_URL }}
      ENVIRONMENT: production
      CORS_ORIGINS: https://www.transparenciatotal.pt
      OFFICIAL_USER_AGENT: ${{ secrets.PRODUCTION_OFFICIAL_USER_AGENT }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v7
        with:
          python-version-file: .python-version
          cache: pip
      - name: Validar configuração
        run: |
          test -n "$DATABASE_URL"
          test -n "$OFFICIAL_USER_AGENT"
      - name: Instalar backend
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e './backend'
      - name: Atualizar índices oficiais sem promoção editorial
        working-directory: backend
        run: python -m scripts.refresh_v4_indexes
