name: Isolated database restore drill

on:
  workflow_dispatch:
    inputs:
      backup_object_key:
        description: Chave exata do objeto .dump.age indicada pelo backup
        required: true
        type: string
      expected_ciphertext_sha256:
        description: SHA-256 cifrado indicado pelo backup
        required: true
        type: string
      expected_manifest_sha256:
        description: SHA-256 do ficheiro de manifesto indicado pelo backup
        required: true
        type: string
      confirmation:
        description: Escreva RESTAURO para confirmar o ensaio isolado
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: transparencia-total-database-restore-drill
  cancel-in-progress: false

jobs:
  restore:
    if: ${{ inputs.confirmation == 'RESTAURO' }}
    runs-on: ubuntu-latest
    environment: recovery
    timeout-minutes: 60
    env:
      B2_BUCKET_NAME: ${{ vars.B2_BUCKET_NAME }}
      B2_S3_ENDPOINT: ${{ vars.B2_S3_ENDPOINT }}
      B2_S3_REGION: ${{ vars.B2_S3_REGION }}
      BACKUP_AGE_RECIPIENT: ${{ vars.BACKUP_AGE_RECIPIENT }}
      AWS_DEFAULT_REGION: ${{ vars.B2_S3_REGION }}
      AWS_REGION: ${{ vars.B2_S3_REGION }}
      AWS_EC2_METADATA_DISABLED: "true"
      RESTORE_DATABASE_URL: postgresql://postgres:restore-drill-only@localhost:5432/transparencia_restore
      PYTHONUNBUFFERED: "1"
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: restore-drill-only
          POSTGRES_DB: transparencia_restore
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d transparencia_restore"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Validar destino, objeto e segredos de recuperação
        id: prepare
        shell: bash
        env:
          BACKUP_OBJECT_KEY: ${{ inputs.backup_object_key }}
          EXPECTED_CIPHERTEXT_SHA256: ${{ inputs.expected_ciphertext_sha256 }}
          EXPECTED_MANIFEST_SHA256: ${{ inputs.expected_manifest_sha256 }}
          B2_RESTORE_KEY_ID: ${{ secrets.B2_RESTORE_KEY_ID }}
          B2_RESTORE_APPLICATION_KEY: ${{ secrets.B2_RESTORE_APPLICATION_KEY }}
          BACKUP_AGE_IDENTITY: ${{ secrets.BACKUP_AGE_IDENTITY }}
        run: |
          set -euo pipefail
          test -n "$B2_RESTORE_KEY_ID"
          test -n "$B2_RESTORE_APPLICATION_KEY"
          test -n "$BACKUP_AGE_IDENTITY"
          [[ "$BACKUP_AGE_RECIPIENT" =~ ^age1[0-9a-z]+$ ]]
          [[ "$B2_BUCKET_NAME" =~ ^[a-zA-Z0-9][a-zA-Z0-9-]{4,48}[a-zA-Z0-9]$ ]]
          [[ "$B2_S3_REGION" =~ ^eu-central-[0-9]+$ ]]
          test "$B2_S3_ENDPOINT" = "https://s3.${B2_S3_REGION}.backblazeb2.com"
          [[ "$BACKUP_OBJECT_KEY" =~ ^database/daily/[0-9]{4}/[0-9]{2}/[0-9]{2}/transparencia-total-[0-9]{8}T[0-9]{6}Z-[0-9]+-[0-9]+\.dump\.age$ ]]
          [[ "$EXPECTED_CIPHERTEXT_SHA256" =~ ^[0-9a-f]{64}$ ]]
          [[ "$EXPECTED_MANIFEST_SHA256" =~ ^[0-9a-f]{64}$ ]]
          manifest_key="${BACKUP_OBJECT_KEY%.dump.age}.manifest.json"
          output_dir="$RUNNER_TEMP/database-restore-drill"
          mkdir -p "$output_dir"
          {
            echo "started_at=$(date -u +'%Y-%m-%dT%H:%M:%SZ')"
            echo "backup_object_key=$BACKUP_OBJECT_KEY"
            echo "manifest_object_key=$manifest_key"
            echo "ciphertext=$output_dir/backup.dump.age"
            echo "manifest=$output_dir/backup.manifest.json"
            echo "attestation=$output_dir/restore-attestation.json"
          } >> "$GITHUB_OUTPUT"

      - name: Confirmar privilégio mínimo da chave B2
        working-directory: backend
        env:
          B2_KEY_ID: ${{ secrets.B2_RESTORE_KEY_ID }}
          B2_APPLICATION_KEY: ${{ secrets.B2_RESTORE_APPLICATION_KEY }}
        run: >-
          python -m scripts.verify_b2_application_key_scope
          --role restore
          --bucket "$B2_BUCKET_NAME"
          --prefix "database/"
          --s3-endpoint "$B2_S3_ENDPOINT"

      - name: Preparar ferramentas compatíveis
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install --yes age
          python -m pip install --upgrade pip
          python -m pip install -e './backend'
          aws --version
          docker --version
          docker pull postgres:17

      - name: Confirmar identidade age contra o destinatário do backup
        shell: bash
        env:
          BACKUP_AGE_IDENTITY: ${{ secrets.BACKUP_AGE_IDENTITY }}
        run: |
          set -euo pipefail
          umask 077
          identity_file="$RUNNER_TEMP/database-restore-age-identity.txt"
          trap 'rm -f "$identity_file"' EXIT
          printf '%s\n' "$BACKUP_AGE_IDENTITY" > "$identity_file"
          unset BACKUP_AGE_IDENTITY
          chmod 600 "$identity_file"

          if ! derived_recipient="$(age-keygen -y "$identity_file" 2>/dev/null)"; then
            echo "::error::BACKUP_AGE_IDENTITY não contém uma identidade privada age válida."
            exit 1
          fi
          if [ "$derived_recipient" != "$BACKUP_AGE_RECIPIENT" ]; then
            echo "::error::A identidade privada age não corresponde ao destinatário usado no backup."
            exit 1
          fi

      - name: Descarregar cópia e manifesto com credencial só de leitura
        shell: bash
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.B2_RESTORE_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.B2_RESTORE_APPLICATION_KEY }}
          BACKUP_OBJECT_KEY: ${{ steps.prepare.outputs.backup_object_key }}
          MANIFEST_OBJECT_KEY: ${{ steps.prepare.outputs.manifest_object_key }}
          CIPHERTEXT: ${{ steps.prepare.outputs.ciphertext }}
          MANIFEST: ${{ steps.prepare.outputs.manifest }}
        run: |
          set -euo pipefail
          aws s3api get-object \
            --bucket "$B2_BUCKET_NAME" \
            --key "$BACKUP_OBJECT_KEY" \
            --endpoint-url "$B2_S3_ENDPOINT" \
            "$CIPHERTEXT" >/dev/null
          aws s3api get-object \
            --bucket "$B2_BUCKET_NAME" \
            --key "$MANIFEST_OBJECT_KEY" \
            --endpoint-url "$B2_S3_ENDPOINT" \
            "$MANIFEST" >/dev/null

      - name: Confirmar SHA-256 antes de decifrar
        working-directory: backend
        env:
          BACKUP_OBJECT_KEY: ${{ steps.prepare.outputs.backup_object_key }}
          CIPHERTEXT: ${{ steps.prepare.outputs.ciphertext }}
          MANIFEST: ${{ steps.prepare.outputs.manifest }}
          EXPECTED_CIPHERTEXT_SHA256: ${{ inputs.expected_ciphertext_sha256 }}
          EXPECTED_MANIFEST_SHA256: ${{ inputs.expected_manifest_sha256 }}
        run: >-
          python -m scripts.verify_database_backup_ciphertext
          --manifest "$MANIFEST"
          --ciphertext "$CIPHERTEXT"
          --object-key "$BACKUP_OBJECT_KEY"
          --expected-ciphertext-sha256 "$EXPECTED_CIPHERTEXT_SHA256"
          --expected-manifest-sha256 "$EXPECTED_MANIFEST_SHA256"

      - name: Restaurar apenas no PostgreSQL efémero
        shell: bash
        env:
          BACKUP_AGE_IDENTITY: ${{ secrets.BACKUP_AGE_IDENTITY }}
          PGDATABASE: ${{ env.RESTORE_DATABASE_URL }}
          CIPHERTEXT: ${{ steps.prepare.outputs.ciphertext }}
        run: |
          set -euo pipefail
          umask 077
          identity_file="$RUNNER_TEMP/database-restore-age-identity.txt"
          trap 'rm -f "$identity_file"' EXIT
          printf '%s\n' "$BACKUP_AGE_IDENTITY" > "$identity_file"
          unset BACKUP_AGE_IDENTITY
          chmod 600 "$identity_file"
          age --decrypt --identity "$identity_file" \
            "$CIPHERTEXT" \
            | docker run --rm --network host -i -e PGDATABASE postgres:17 \
                pg_restore --dbname "$PGDATABASE" \
                  --clean --if-exists --no-owner --no-privileges \
                  --exit-on-error --single-transaction
          rm -f "$identity_file"

      - name: Verificar arquivo oficial restaurado
        working-directory: backend
        env:
          DATABASE_URL: ${{ env.RESTORE_DATABASE_URL }}
          ENVIRONMENT: test
        run: >-
          python -m scripts.verify_v4_archive
          > "$RUNNER_TEMP/database-restore-archive-report.json"

      - name: Registar estado operacional restaurado
        id: operational
        working-directory: backend
        shell: bash
        env:
          DATABASE_URL: ${{ env.RESTORE_DATABASE_URL }}
          ENVIRONMENT: test
          V4_SOURCE_MAX_AGE_HOURS: "36"
        run: |
          set +e
          python -m scripts.check_v4_operational_status \
            > "$RUNNER_TEMP/database-restore-operational-report.json"
          exit_code=$?
          set -e
          test -s "$RUNNER_TEMP/database-restore-operational-report.json"
          echo "exit_code=$exit_code" >> "$GITHUB_OUTPUT"
          if [ "$exit_code" -ne 0 ]; then
            echo "A idade das fontes exige atenção; o facto fica preservado na atestação."
          fi

      - name: Inventariar destino restaurado
        working-directory: backend
        env:
          DATABASE_URL: ${{ env.RESTORE_DATABASE_URL }}
          ENVIRONMENT: test
        run: >-
          python -m scripts.capture_database_inventory
          --output "$RUNNER_TEMP/database-restored-inventory.json"

      - name: Construir atestação do ensaio
        id: attest
        working-directory: backend
        shell: bash
        env:
          ATTESTATION: ${{ steps.prepare.outputs.attestation }}
          BACKUP_OBJECT_KEY: ${{ steps.prepare.outputs.backup_object_key }}
          CIPHERTEXT: ${{ steps.prepare.outputs.ciphertext }}
          MANIFEST: ${{ steps.prepare.outputs.manifest }}
          RESTORE_STARTED_AT: ${{ steps.prepare.outputs.started_at }}
          EXPECTED_CIPHERTEXT_SHA256: ${{ inputs.expected_ciphertext_sha256 }}
          EXPECTED_MANIFEST_SHA256: ${{ inputs.expected_manifest_sha256 }}
        run: |
          set -euo pipefail
          completed_at="$(date -u +'%Y-%m-%dT%H:%M:%SZ')"
          python -m scripts.build_database_restore_attestation \
            --manifest "$MANIFEST" \
            --ciphertext "$CIPHERTEXT" \
            --object-key "$BACKUP_OBJECT_KEY" \
            --restored-inventory "$RUNNER_TEMP/database-restored-inventory.json" \
            --archive-report "$RUNNER_TEMP/database-restore-archive-report.json" \
            --operational-report "$RUNNER_TEMP/database-restore-operational-report.json" \
            --started-at "$RESTORE_STARTED_AT" \
            --completed-at "$completed_at" \
            --repository "$GITHUB_REPOSITORY" \
            --workflow-run-id "$GITHUB_RUN_ID" \
            --expected-ciphertext-sha256 "$EXPECTED_CIPHERTEXT_SHA256" \
            --expected-manifest-sha256 "$EXPECTED_MANIFEST_SHA256" \
            --output "$ATTESTATION"
          outcome="$(jq -r '.outcome' "$ATTESTATION")"
          sha256="$(jq -r '.attestation_sha256' "$ATTESTATION")"
          rpo="$(jq -r '.restore.rpo_seconds_at_drill_start' "$ATTESTATION")"
          rto="$(jq -r '.restore.rto_seconds' "$ATTESTATION")"
          {
            echo "outcome=$outcome"
            echo "sha256=$sha256"
            echo "rpo=$rpo"
            echo "rto=$rto"
          } >> "$GITHUB_OUTPUT"

      - name: Remover chave e cópia antes de publicar a atestação
        shell: bash
        run: |
          rm -f \
            "$RUNNER_TEMP/database-restore-age-identity.txt" \
            "${{ steps.prepare.outputs.ciphertext }}" \
            "${{ steps.prepare.outputs.manifest }}" \
            "$RUNNER_TEMP/database-restored-inventory.json" \
            "$RUNNER_TEMP/database-restore-archive-report.json" \
            "$RUNNER_TEMP/database-restore-operational-report.json"

      - name: Conservar apenas a atestação não sensível
        id: artifact
        uses: actions/upload-artifact@v7
        with:
          name: database-restore-attestation-${{ github.run_id }}
          path: ${{ steps.prepare.outputs.attestation }}
          if-no-files-found: error
          retention-days: 90
          compression-level: 0

      - name: Registar resultado medido
        shell: bash
        run: |
          {
            echo "## Ensaio de restauro PostgreSQL"
            echo ""
            echo "- Resultado: ${{ steps.attest.outputs.outcome }}"
            echo "- Destino: PostgreSQL 17 isolado e efémero"
            echo "- Produção usada como destino: não"
            echo "- RPO observado no início: ${{ steps.attest.outputs.rpo }} segundos"
            echo "- RTO observado: ${{ steps.attest.outputs.rto }} segundos"
            echo "- SHA-256 da atestação: \`${{ steps.attest.outputs.sha256 }}\`"
            echo "- Atestação: ${{ steps.artifact.outputs.artifact-url }}"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Limpeza final do runner
        if: ${{ always() }}
        shell: bash
        run: |
          rm -f \
            "$RUNNER_TEMP/database-restore-age-identity.txt" \
            "${{ steps.prepare.outputs.ciphertext }}" \
            "${{ steps.prepare.outputs.manifest }}" \
            "${{ steps.prepare.outputs.attestation }}" \
            "$RUNNER_TEMP/database-restored-inventory.json" \
            "$RUNNER_TEMP/database-restore-archive-report.json" \
            "$RUNNER_TEMP/database-restore-operational-report.json"
