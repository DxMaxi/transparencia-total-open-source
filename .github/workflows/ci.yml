name: CI

on:
  push:
    branches:
      - main
      - "codex/v4-**"
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  frontend:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: postgresql://user:password@localhost:5432/transparencia_total
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run db:validate
      - run: npm run test:frontend
      - run: npm run db:generate
      - run: npm run build:next

  backend:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/transparencia_total_test
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: transparencia_total_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d transparencia_total_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: npm ci
      - run: npm run db:deploy
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e './backend[dev]'
      - run: ruff check backend
      - run: ruff format --diff backend/app/repositories/dre_staging.py
      - run: ruff format --check backend
      - run: mypy --config-file backend/pyproject.toml backend/app
      - run: pytest backend
