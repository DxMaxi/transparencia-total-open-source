name: CI

on:
  push:
    branches:
      - main
      - "codex/v4-**"
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  frontend:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: postgresql://user:password@localhost:5432/transparencia_total?schema=public
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run db:validate
      - run: npm run test:frontend
      - run: npm run db:generate
      - run: npm run build:next
      - run: npm run verify:next-artifact
      - name: Instalar Chromium para E2E local
        run: npx playwright install --with-deps chromium
      - name: Verificar a interface construída num navegador real
        run: npx playwright test tests/e2e/public-site.spec.js --workers=1
        env:
          PLAYWRIGHT_BASE_URL: http://127.0.0.1:3000
          PLAYWRIGHT_START_SERVER: "1"
      - name: Aplicar orçamento móvel repetível
        run: npm run performance:mobile
      - name: Guardar diagnóstico Lighthouse apenas quando falhar
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: lighthouse-diagnostics
          path: .sites-runtime/lighthouse/
          if-no-files-found: ignore
          retention-days: 7
      - name: Guardar diagnóstico E2E apenas quando falhar
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-diagnostics
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
          retention-days: 7

  backend:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/transparencia_total_test?schema=public
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: transparencia_total_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d transparencia_total_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - uses: actions/setup-python@v6
        with:
          python-version-file: .python-version
          cache: pip
      - name: Verificar paridade do runtime Python
        run: python backend/scripts/check_python_runtime_policy.py --check-interpreter
      - run: npm ci
      - name: Preparar contrato Supabase apenas na base descartável
        run: npm run db:test:bootstrap-supabase
        env:
          ENVIRONMENT: test
          CONFIRM_DISPOSABLE_DATABASE: "true"
      - run: npm run db:deploy
      - run: python -m pip install --upgrade pip
      - name: Verificar sincronizacao das dependencias Python
        run: python backend/scripts/check_dependency_sync.py
      - name: Validar instalacao pelas requirements do backend
        run: python -m pip install -r backend/requirements.txt
      - run: python -m pip install -e './backend[dev]'
      - run: ruff check backend
      - run: ruff format --check backend
      - run: mypy --config-file backend/pyproject.toml backend/app
      - run: pytest backend
