name: Public smoke

on:
  deployment_status:
  schedule:
    - cron: "53 6 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: transparencia-total-public-smoke
  cancel-in-progress: true

jobs:
  public-smoke:
    if: >-
      github.event_name != 'deployment_status' ||
      (github.event.deployment_status.state == 'success' &&
       github.event.deployment.environment == 'Production')
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      PUBLIC_SITE_URL: https://www.transparenciatotal.pt
      SMOKE_ATTEMPTS: "12"
      SMOKE_DELAY_MS: "20000"
      SMOKE_TIMEOUT_MS: "15000"
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Verificar frontend, API pública, PWA e cabeçalhos
        run: npm run smoke:public

      - name: Instalar dependencias Node para E2E
        run: npm ci

      - name: Instalar Chromium para Playwright
        run: npx playwright install --with-deps chromium

      - name: Executar E2E publico no Chromium
        run: npx playwright test tests/e2e/public-site.spec.js --workers=1
