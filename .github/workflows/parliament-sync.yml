name: Parliament staging sync

on:
  schedule:
    - cron: "41 3 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: transparencia-total-parliament-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 45
    env:
      DATABASE_URL: ${{ secrets.PRODUCTION_DATABASE_URL }}
      ENVIRONMENT: production
      CORS_ORIGINS: https://www.transparenciatotal.pt
      OFFICIAL_USER_AGENT: ${{ secrets.PRODUCTION_OFFICIAL_USER_AGENT }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Validar configuração
        run: |
          test -n "$DATABASE_URL"
          test -n "$OFFICIAL_USER_AGENT"
      - name: Instalar backend
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e './backend'
      - name: Recolher deputados sem publicar
        working-directory: backend
        run: python -m scripts.sync_parliament deputies --legislature XVII --persist
      - name: Recolher sessões, iniciativas e votações sem publicar
        working-directory: backend
        run: python -m scripts.sync_parliament_activity --legislature XVII
