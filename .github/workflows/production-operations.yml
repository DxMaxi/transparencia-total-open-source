name: Production operations

on:
  workflow_dispatch:
    inputs:
      operation:
        description: Operação controlada a executar
        required: true
        type: choice
        options:
          - migrate
          - refresh-official-indexes
          - sync-parliament-deputies
          - sync-parliament-activity
          - preview-parliament-activity
          - publish-parliament-activity
          - withdraw-parliament-activity
          - bootstrap-parliament-publication
          - verify-archive-integrity
          - check-operational-status
      confirmation:
        description: Escreva PRODUCAO para confirmar
        required: true
        type: string
      parliament_scope:
        description: Âmbito da atividade parlamentar
        required: false
        default: all
        type: choice
        options:
          - all
          - activity
          - votes
      parliament_source_sha256:
        description: SHA-256 dos bytes confirmado na pré-visualização
        required: false
        type: string
      parliament_normalised_sha256:
        description: SHA-256 normalizado confirmado na pré-visualização
        required: false
        type: string
      expected_sessions:
        description: Contagem confirmada de sessões
        required: false
        type: string
      expected_initiatives:
        description: Contagem confirmada de iniciativas
        required: false
        type: string
      expected_votes:
        description: Contagem confirmada de votações
        required: false
        type: string
      expected_vote_records:
        description: Contagem confirmada de posições de voto
        required: false
        type: string
      reviewer_alias:
        description: Pseudónimo público do revisor
        required: false
        type: string
      review_rationale:
        description: Fundamentação da decisão (mínimo 20 caracteres)
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: transparencia-total-production-operations
  cancel-in-progress: false

jobs:
  operate:
    if: ${{ inputs.confirmation == 'PRODUCAO' }}
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 90
    env:
      PYTHONUNBUFFERED: "1"
      DATABASE_URL: ${{ secrets.PRODUCTION_DATABASE_URL }}
      ENVIRONMENT: production
      CORS_ORIGINS: https://www.transparenciatotal.pt
      ADMIN_API_KEY: ${{ secrets.PRODUCTION_ADMIN_API_KEY }}
      OFFICIAL_USER_AGENT: ${{ secrets.PRODUCTION_OFFICIAL_USER_AGENT }}
      PROTECTED_IDENTIFIER_PEPPER: ${{ secrets.PRODUCTION_IDENTIFIER_PEPPER }}
      V4_SOURCE_MAX_AGE_HOURS: "36"
      PARLIAMENT_SCOPE: ${{ inputs.parliament_scope }}
      PARLIAMENT_SOURCE_SHA256: ${{ inputs.parliament_source_sha256 }}
      PARLIAMENT_NORMALISED_SHA256: ${{ inputs.parliament_normalised_sha256 }}
      EXPECTED_SESSIONS: ${{ inputs.expected_sessions }}
      EXPECTED_INITIATIVES: ${{ inputs.expected_initiatives }}
      EXPECTED_VOTES: ${{ inputs.expected_votes }}
      EXPECTED_VOTE_RECORDS: ${{ inputs.expected_vote_records }}
      REVIEWER_ALIAS: ${{ inputs.reviewer_alias }}
      REVIEW_RATIONALE: ${{ inputs.review_rationale }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v6
        if: ${{ inputs.operation == 'migrate' }}
        with:
          node-version: 24
          cache: npm

      - uses: actions/setup-python@v6
        if: ${{ inputs.operation != 'migrate' }}
        with:
          python-version-file: .python-version
          cache: pip

      - name: Validar configuração obrigatória
        shell: bash
        run: |
          test -n "$DATABASE_URL"
          test -n "$OFFICIAL_USER_AGENT"
          if [ "${{ inputs.operation }}" = "bootstrap-parliament-publication" ]; then
            test -n "$ADMIN_API_KEY"
          fi
          if [ "${{ inputs.operation }}" = "publish-parliament-activity" ] || [ "${{ inputs.operation }}" = "withdraw-parliament-activity" ]; then
            test -n "$PARLIAMENT_SOURCE_SHA256"
            test -n "$PARLIAMENT_NORMALISED_SHA256"
            test -n "$EXPECTED_SESSIONS"
            test -n "$EXPECTED_INITIATIVES"
            test -n "$EXPECTED_VOTES"
            test -n "$EXPECTED_VOTE_RECORDS"
            test -n "$REVIEWER_ALIAS"
            test -n "$REVIEW_RATIONALE"
          fi

      - name: Aplicar migrações Prisma
        if: ${{ inputs.operation == 'migrate' }}
        run: |
          npm ci
          npm run db:deploy

      - name: Instalar backend
        if: ${{ inputs.operation != 'migrate' }}
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e './backend'

      - name: Atualizar índices oficiais
        if: ${{ inputs.operation == 'refresh-official-indexes' }}
        working-directory: backend
        run: python -m scripts.refresh_v4_indexes

      - name: Recolher deputados em staging
        if: ${{ inputs.operation == 'sync-parliament-deputies' }}
        working-directory: backend
        run: >-
          python -m scripts.sync_parliament deputies --legislature XVII
          --persist --summary-only

      - name: Recolher atividade parlamentar em staging
        if: ${{ inputs.operation == 'sync-parliament-activity' }}
        working-directory: backend
        run: python -m scripts.sync_parliament_activity --legislature XVII

      - name: Pré-visualizar fotografia parlamentar
        if: ${{ inputs.operation == 'preview-parliament-activity' }}
        working-directory: backend
        run: python -m scripts.review_parliament_activity --legislature XVII

      - name: Publicar fotografia parlamentar revista
        if: ${{ inputs.operation == 'publish-parliament-activity' }}
        working-directory: backend
        run: >-
          python -m scripts.review_parliament_activity --legislature XVII
          --publish --scope "$PARLIAMENT_SCOPE"
          --source-sha256 "$PARLIAMENT_SOURCE_SHA256"
          --normalised-sha256 "$PARLIAMENT_NORMALISED_SHA256"
          --expected-sessions "$EXPECTED_SESSIONS"
          --expected-initiatives "$EXPECTED_INITIATIVES"
          --expected-votes "$EXPECTED_VOTES"
          --expected-vote-records "$EXPECTED_VOTE_RECORDS"
          --reviewer "$REVIEWER_ALIAS" --rationale "$REVIEW_RATIONALE"
          --confirm-source-reviewed

      - name: Retirar fotografia parlamentar
        if: ${{ inputs.operation == 'withdraw-parliament-activity' }}
        working-directory: backend
        run: >-
          python -m scripts.review_parliament_activity --legislature XVII
          --withdraw --scope "$PARLIAMENT_SCOPE"
          --source-sha256 "$PARLIAMENT_SOURCE_SHA256"
          --normalised-sha256 "$PARLIAMENT_NORMALISED_SHA256"
          --expected-sessions "$EXPECTED_SESSIONS"
          --expected-initiatives "$EXPECTED_INITIATIVES"
          --expected-votes "$EXPECTED_VOTES"
          --expected-vote-records "$EXPECTED_VOTE_RECORDS"
          --reviewer "$REVIEWER_ALIAS" --rationale "$REVIEW_RATIONALE"
          --confirm-source-reviewed

      - name: Publicar fotografia parlamentar auditada
        if: ${{ inputs.operation == 'bootstrap-parliament-publication' }}
        working-directory: backend
        run: python -m scripts.bootstrap_v4_public

      - name: Verificar integridade do arquivo
        if: ${{ inputs.operation == 'verify-archive-integrity' }}
        working-directory: backend
        run: python -m scripts.verify_v4_archive

      - name: Verificar estado operacional
        if: ${{ inputs.operation == 'check-operational-status' }}
        working-directory: backend
        run: python -m scripts.check_v4_operational_status
